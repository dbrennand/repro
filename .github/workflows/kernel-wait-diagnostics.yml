name: Kernel wait diagnostics
on:
  push:
    branches: [ansible-test-kernel-diagnostics-20261028]
    paths:
      - .github/workflows/kernel-wait-diagnostics.yml
      - scripts/kernel-wait-*.sh
      - scripts/instrument-kernel-wait.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Kernel wait (${{ matrix.trace }}, replica ${{ matrix.replica }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trace: [control, scheduler]
        replica: [1, 2]
    env:
      ANSIBLE_REVISION: f7319e09448e13fa2bc407a1afcd8990f47040fb
      TRACE_MODE: ${{ matrix.trace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Record environment
        run: |
          mkdir -p diagnostics
          {
            printf 'ImageVersion=%s\nAnsible revision=%s\nTrace=%s\n' "$ImageVersion" "$ANSIBLE_REVISION" "$TRACE_MODE"
            uname -a
            cat /proc/version_signature || true
            lscpu
            docker version
            docker info
            findmnt -T /var/lib/docker
            free -m
            sudo cat /sys/kernel/security/lsm || true
            command -v bpftool >/dev/null && sudo bpftool prog show || true
          } 2>&1 | tee diagnostics/environment.log
      - name: Prepare pinned Ansible and smoke collection
        run: |
          python -m pip install "https://github.com/ansible/ansible/archive/${ANSIBLE_REVISION}.tar.gz"
          python scripts/instrument-kernel-wait.py
          target=fixture/ansible_collections/repro/cgroup
          mkdir -p "$target/tests/integration/targets/smoke"
          printf 'namespace: repro\nname: cgroup\nversion: 1.0.0\nreadme: README.md\nauthors: [repro]\n' > "$target/galaxy.yml"
          printf '# Initialization repro\n' > "$target/README.md"
          printf '#!/usr/bin/env bash\nset -eu\nprintf "CONTROLLER_INITIALIZED\\n"\n' > "$target/tests/integration/targets/smoke/runme.sh"
          chmod +x "$target/tests/integration/targets/smoke/runme.sh"
      - name: Run original provisioning on fresh then reused image cache
        shell: bash
        run: |
          export ANSIBLE_REPRO_DIAGNOSTIC="$GITHUB_WORKSPACE/scripts/kernel-wait-failure.sh"
          failed=0
          for trial in 1 2 3; do
            export DIAGNOSTIC_DIR="$GITHUB_WORKSPACE/diagnostics/trial-$trial"
            mkdir -p "$DIAGNOSTIC_DIR"
            if [ "$TRACE_MODE" = scheduler ]; then
              sudo bash scripts/kernel-wait-trace.sh start "$DIAGNOSTIC_DIR"
            fi
            set +e
            (cd fixture/ansible_collections/repro/cgroup && timeout --signal=TERM --kill-after=15s 3m \
              ansible-test integration smoke --color no -v --docker default --python 3.14 \
              --display-traceback error --coverage) 2>&1 | tee "$DIAGNOSTIC_DIR/ansible.log"
            result=${PIPESTATUS[0]}
            set -e
            if [ "$TRACE_MODE" = scheduler ]; then
              sudo bash scripts/kernel-wait-trace.sh stop "$DIAGNOSTIC_DIR"
            fi
            printf 'trial=%s exit=%s kernel=%s trace=%s\n' "$trial" "$result" "$(uname -r)" "$TRACE_MODE" | tee -a diagnostics/results.log
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Collect kernel diagnostics
        if: always()
        run: |
          sudo journalctl -k --no-pager > diagnostics/kernel.log 2>&1
          sudo chmod -R a+rX diagnostics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kernel-wait-${{ matrix.trace }}-${{ matrix.replica }}-${{ github.run_attempt }}
          path: diagnostics/
          retention-days: 14
